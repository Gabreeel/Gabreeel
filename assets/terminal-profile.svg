
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310" role="img" aria-labelledby="title desc">
  <title id="title">PhaseSpider profile analysis</title>
  <desc id="desc">An animated Linux terminal runs Ghidra headless analysis and recovers the identity Gabriel Santana, alias PhaseSpider.</desc>

  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="0.55" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#101529"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H4" stroke="#FFFFFF" stroke-opacity="0.018"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="typed-command">
      <rect x="36" y="55" width="815" height="24">
        <animate attributeName="width" dur="15s" repeatCount="indefinite"
          values="0;0;815;815;0" keyTimes="0;0.02;0.19;0.94;1"/>
      </rect>
    </clipPath>
  </defs>

  <rect x="2" y="2" width="896" height="306" rx="12" fill="url(#shell)" stroke="url(#frame)" stroke-width="2"/>
  <rect x="3" y="3" width="894" height="34" rx="10" fill="#111827"/>
  <path d="M3 27V37H897V27" fill="#111827"/>
  <circle cx="22" cy="20" r="5" fill="#FF5F57"/>
  <circle cx="40" cy="20" r="5" fill="#FEBC2E"/>
  <circle cx="58" cy="20" r="5" fill="#28C840"/>
  <text x="450" y="24" text-anchor="middle" fill="#94A3B8" font-family="'Courier New', 'Liberation Mono', monospace" font-size="12" letter-spacing="1">ghidra-headless • phase@spider</text>

  <!-- A restrained web motif ties the professional terminal to the PhaseSpider identity. -->
  <g fill="none" stroke="#8B5CF6" stroke-opacity="0.10" stroke-width="1">
    <path d="M900 38L760 178M900 38L820 215M900 38L875 230"/>
    <path d="M858 80Q887 97 891 126"/>
    <path d="M823 115Q873 142 882 181"/>
    <path d="M787 151Q852 184 873 232"/>
  </g>

  <g font-family="'Courier New', 'Liberation Mono', monospace" font-size="14">
    <g clip-path="url(#typed-command)">
      <text x="36" y="70" fill="#22D3EE" filter="url(#glow)">phase@spider</text>
      <text x="146" y="70" fill="#64748B">:</text>
      <text x="154" y="70" fill="#A78BFA">~</text>
      <text x="166" y="70" fill="#CBD5E1">$ analyzeHeadless /tmp/profile PhaseSpider -import gabriel.bin</text>
    </g>

    <text x="36" y="104" fill="#94A3B8" opacity="1">INFO  Loading program: gabriel.bin
      <animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.21;0.22;0.94;1"/>
    </text>
    <text x="36" y="130" fill="#94A3B8" opacity="1">INFO  Auto-analysis enabled
      <animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.29;0.30;0.94;1"/>
    </text>
    <text x="36" y="156" fill="#94A3B8" opacity="1">INFO  Recovering symbols...
      <animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.37;0.38;0.94;1"/>
    </text>

    <text x="36" y="194" fill="#4ADE80" opacity="1">PASS
      <animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.46;0.47;0.94;1"/>
    </text>
    <text x="252" y="194" fill="#F8FAFC" font-weight="700" opacity="1">Gabriel Santana
      <animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.46;0.47;0.94;1"/>
    </text>
    <g opacity="1">
      <animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.46;0.47;0.94;1"/>
      <text x="82" y="194" fill="#CBD5E1">identity.name</text>
      <text x="222" y="194" fill="#64748B">-&gt;</text>
    </g>

    <g opacity="1">
      <animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.56;0.57;0.94;1"/>
      <text x="36" y="220" fill="#4ADE80">PASS</text>
      <text x="82" y="220" fill="#CBD5E1">identity.alias</text>
      <text x="222" y="220" fill="#64748B">-&gt;</text>
      <text x="252" y="220" fill="#A78BFA" font-weight="700" filter="url(#glow)">PhaseSpider</text>
    </g>

    <g opacity="1">
      <animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.66;0.67;0.94;1"/>
      <text x="36" y="246" fill="#4ADE80">PASS</text>
      <text x="82" y="246" fill="#CBD5E1">focus</text>
      <text x="222" y="246" fill="#64748B">-&gt;</text>
      <text x="252" y="246" fill="#22D3EE">malware analysis | security automation</text>
    </g>

    <g opacity="1">
      <animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.76;0.77;0.94;1"/>
      <text x="36" y="280" fill="#4ADE80">EXIT</text>
      <text x="82" y="280" fill="#94A3B8">Analysis complete. Profile ready.</text>
      <rect x="374" y="267" width="9" height="16" fill="#22D3EE" filter="url(#glow)">
        <animate attributeName="opacity" dur="0.8s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.48;0.5;1"/>
      </rect>
    </g>
  </g>

  <rect x="3" y="38" width="894" height="268" fill="url(#scanlines)" pointer-events="none"/>
</svg>
