<svg xmlns="http://www.w3.org/2000/svg" width="840" height="220" viewBox="0 0 840 220" role="img" aria-labelledby="title desc">
  <title id="title">Research terminal: comparing candidate lists</title>
  <desc id="desc">A real Python command compares synthetic lists. Three candidates before, five after, four new, two gone and one unchanged.</desc>
  <defs>
    <linearGradient id="edge" x2="1" y2="1">
      <stop stop-color="#435377"/>
      <stop offset="1" stop-color="#262d41"/>
    </linearGradient>
    <style>
      text { font-family: 'DejaVu Sans Mono', 'Liberation Mono', monospace; }
      @keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0); } }
      @keyframes show { from { opacity: 0; } to { opacity: 1; } }
      @media (prefers-reduced-motion: no-preference) {
        .command { animation: type 1.65s steps(64, end) .2s both; }
        .first { animation: show .01s step-end 2s both; }
        .second { animation: show .01s step-end 2.12s both; }
        .third { animation: show .01s step-end 2.24s both; }
        .fourth { animation: show .01s step-end 2.36s both; }
      }
    </style>
  </defs>
  <rect x="1" y="1" width="838" height="218" rx="12" fill="#0b101b" stroke="url(#edge)" stroke-width="2"/>
  <path d="M13 2h814a11 11 0 0 1 11 11v23H2V13A11 11 0 0 1 13 2Z" fill="#171f30"/>
  <path d="M2 36h836" stroke="#303a53"/>
  <circle cx="21" cy="19" r="3.5" fill="#fc8794"/>
  <circle cx="34" cy="19" r="3.5" fill="#f6ca84"/>
  <circle cx="47" cy="19" r="3.5" fill="#79d9ad"/>
  <text x="66" y="23" font-size="12" fill="#b5c0d6">~/CE-Malware-Obfuscation</text>
  <text x="811" y="23" text-anchor="end" font-size="11" letter-spacing="1" fill="#b5c0d6">RESEARCH DEMO</text>
  <g font-size="16">
    <text x="24" y="70" fill="#7de3cc">$</text>
    <text x="46" y="70" class="command" fill="#eef2fa">python scripts/comparar_candidatos.py examples/par_ficticio.json</text>
    <text x="24" y="107" class="first" fill="#f6ca84">EXEMPLO FICTICIO - nao e resultado de malware.</text>
    <text x="24" y="133" class="second" fill="#a4b4cd">Amostra: FICTICIA_01 | Ferramenta: simulada</text>
    <text x="24" y="161" class="third" fill="#7de3cc">Antes: 3 | Depois: 5 | Diferenca: +2</text>
    <text x="24" y="188" class="fourth" fill="#e0e8f7">Novos: 4 | Deixaram de aparecer: 2 | Continuaram: 1</text>
  </g>
</svg>
